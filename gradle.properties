# ===============================
# JVM arguments para Gradle/Kotlin
# ===============================
# -Xmx4G  -> limite máximo de heap: 4GB
# -Xms2G  -> heap inicial maior para builds pesados
# G1GC    -> garbage collector eficiente
# MaxGCPauseMillis -> tenta limitar pausas de GC a ~100ms
org.gradle.jvmargs=-Xmx4G -Xms2G -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication
# ===============================
# Evita travamentos desnecessários
# ===============================
# Gradle daemon é OK em Btrfs, então pode ativar para builds mais rápidos
org.gradle.daemon=true
# Build paralelo ajuda em SSD/Btrfs
org.gradle.parallel=true
# ===============================
# Kotlin incremental & cache
# ===============================
# Ativa compilação incremental
kotlin.incremental=true
# Uso in-process ainda recomendado pra builds antigos de Minecraft 1.8.9
kotlin.compiler.execution.strategy=in-process
# ===============================
# Warnings e logging
# ===============================
# Mostra todos warnings do Gradle
org.gradle.warning.mode=all