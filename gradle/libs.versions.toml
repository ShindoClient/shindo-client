[versions]
kotlin = "2.3.10"

mixin = "0.7.11-SNAPSHOT"
romaji = "0.0.4"
spotify = "6.5.4"
okhttp = "5.3.2"
gson = "2.13.1"
i18n = "1.29"
yaml = "2.0"
mc-auth = "5.0.0"
addon-api = "1.0.5"
shindo-spotify = "1.0.1"

[libraries]
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
romaji = { group = "com.github.jikyo", name = "romaji", version.ref = "romaji" }
spotify = { group = "se.michaelthelin.spotify", name = "spotify-web-api-java", version.ref = "spotify" }
spotify-web-api = { group = "se.michaelthelin.spotify", name = "spotify-web-api-java", version.ref = "spotify" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
i18n = { group = "com.neovisionaries", name = "nv-i18n", version.ref = "i18n" }
yaml = { group = "org.yaml", name = "snakeyaml", version.ref = "yaml"}
mc-auth = { group = "net.raphimc", name = "MinecraftAuth", version.ref = "mc-auth"}
addon-api = { group = "com.ShindoClient", name = "AddonAPI", version.ref = "addon-api"}
shindo-spotify = { group = "com.ShindoClient", name = "ShindoSpotify", version.ref = "shindo-spotify"}

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization ={ id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
forge-gradle = { id = "net.minecraftforge.gradle.tweaker-client"}
mixin-gradle = { id = "org.spongepowered.mixin"}

[bundles]
okhttp = ["okhttp", "okhttp-coroutines"]
shindo = ["addon-api", "shindo-spotify"]
