buildscript {
    ext.kotlin_version = '1.3.72'

    repositories {
        mavenCentral()
        maven { name = "forge";  url = "https://maven.minecraftforge.net" }
        maven { name = "sponge"; url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://jitpack.io" }
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.3'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'idea'

version             = "5112"
group               = "me.miki"
archivesBaseName    = "ShindoClient"

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding = "UTF-8"

compileKotlin {
    kotlinOptions {
        jvmTarget       = "1.8"
        languageVersion = "1.3"
        apiVersion      = "1.3"
        freeCompilerArgs += ["-Xallow-no-source-files"]
    }
}

minecraft {
    version          = "1.8.9"
    runDir           = "run"
    tweakClass       = "me.miki.shindo.injection.mixin.ShindoTweaker"
    mappings         = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { name = "Jitpack";       url = "https://jitpack.io" }
    maven { name = "SpongePowered"; url = "https://repo.spongepowered.org/maven" }
    maven { name = "CleanroomMC";   url = "https://maven.cleanroommc.com" }
}

configurations {
    embed
    compile.extendsFrom(embed)
    shadowEmbed
    shadowEmbed.extendsFrom(embed)
}

configurations.all {
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

dependencies {

    // --- Kotlin runtime ---
    embed "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // --- Mixin ---
    annotationProcessor "org.spongepowered:mixin:0.7.11-SNAPSHOT"
    embed("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: "launchwrapper"
        exclude module: "guava"
        exclude module: "gson"
        exclude module: "commons-io"
    }

    // --- Spotify integration ---
    embed("com.github.jikyo:romaji:0.0.4")
    embed("se.michaelthelin.spotify:spotify-web-api-java:6.5.4") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    embed "com.neovisionaries:nv-i18n:1.29"

    // --- Networking ---
    embed "com.squareup.okhttp3:okhttp:3.14.9"

    // --- JSON (single source of truth) ---
    embed "com.google.code.gson:gson:2.13.1"

    // --- Local native libs ---
    embed files("libs/lwjgl-shindo.jar")
    embed files("libs/lwjgl-shindo-natives.jar")
    embed files("libs/viashindo-1.0.0.jar")
}

mixin {
    defaultObfuscationEnv = "notch"
    add sourceSets.main, "mixins.shindo.refmap.json"
}

sourceSets {
    main {
        kotlin { srcDirs = ['src/main/kotlin', 'src/main/java'] }
        java   { srcDirs = ['src/main/java'] }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Copy).matching { it.name == 'processResources' }.configureEach {
    from("src/main/resources") { into "" }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes(
            "MixinConfigs"    : "mixins.shindo.json",
            "TweakClass"      : "me.miki.shindo.injection.mixin.ShindoTweaker",
            "TweakOrder"      : 0,
            "Manifest-Version": "1.0",
            "FMLAT"           : "shindo_at.cfg"
    )
}

apply plugin: 'com.github.johnrengelman.shadow'

shadowJar {
    // Output: ShindoClient-<version>-release.jar
    classifier = "release"

    // Read deps from our custom `shadowEmbed` configuration (which extends `embed`)
    configurations = [project.configurations.shadowEmbed]

    // Exclusions
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    // Drop redundant metadata
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/proguard/**'
    // Drop multi-release bytecode (Java 9+ only)
    exclude 'META-INF/versions/**'
    // Drop service descriptors that conflict with Forge's own providers
    exclude 'META-INF/services/javax.*'
    // Drop Java 9+ module descriptors
    exclude 'module-info.class'
    // Drop Kotlin compiler-internal classes (not needed at runtime)
    exclude 'kotlin/reflect/**'
    exclude 'kotlin/internal/**'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Manifest
    manifest.attributes(
            "MixinConfigs"    : "mixins.shindo.json",
            "TweakClass"      : "me.miki.shindo.injection.mixin.ShindoTweaker",
            "TweakOrder"      : 0,
            "Manifest-Version": "1.0",
            "FMLAT"           : "shindo_at.cfg"
    )

    // Package relocation
    relocate 'okhttp3',                     'me.miki.shindo.libs.okhttp3'
    relocate 'okio',                        'me.miki.shindo.libs.okio'
    relocate 'org.java_websocket',          'me.miki.shindo.libs.websocket'
    relocate 'com.wrapper.spotify',         'me.miki.shindo.libs.spotify'
    relocate 'com.neovisionaries',          'me.miki.shindo.libs.neovisionaries'

    // Task ordering
    dependsOn reobfJar
}

// Ensure `./gradlew build` produces the shadow jar automatically
build {
    dependsOn shadowJar
}