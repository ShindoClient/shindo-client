buildscript {
    ext.kotlin_version = '1.3.72'
    repositories {
        mavenCentral()
        jcenter()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://jitpack.io" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

apply plugin: "net.minecraftforge.gradle.tweaker-client"
apply plugin: "org.spongepowered.mixin"
apply plugin: "java"
apply plugin: "kotlin"
apply plugin: "kotlinx-serialization"
apply plugin: "idea"

version = "5111"
group = "me.miki"
archivesBaseName = "ShindoClient"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
        languageVersion = "1.3"
        apiVersion = "1.3"
        freeCompilerArgs += ["-Xallow-no-source-files"]
    }
}

minecraft {
    version = "1.8.9"
    runDir = "run"
    tweakClass = "me.miki.shindo.injection.mixin.ShindoTweaker"
    mappings = "stable_22"

    // JVM args do runClient
    clientJvmArgs = [
            "-Xmx4G",                    // máximo de memória
            "-Xms1G",                    // inicialização
            "-XX:+UseG1GC",              // G1GC
            "-XX:MaxGCPauseMillis=200",
            "-Dorg.lwjgl.util.Debug=true",      // LWJGL verbose
            "-Dorg.lwjgl.util.DebugLevel=DEBUG",
            "-Dlog4j.debug=true",        // log4j debug
            "-Dminecraft.applet.TargetDirectory=run", // força pasta run
            "-Dshindo.debug=true"        // flag custom para o client usar internamente
    ]
}

repositories {
    jcenter()
    mavenCentral()
    maven {
        name "Shindo"
        url "https://maven.shindoclient.com/"
        credentials {
            username = project.findProperty("mavenUser") ?: ""
            password = project.findProperty("mavenPassword") ?: ""
        }
    }
    maven {
        name  "Jitpack"
        url "https://jitpack.io"
    }
    maven {
        name "SpongePowered"
        url "https://repo.spongepowered.org/maven/"
    }
    maven {
        url 'https://maven.cleanroommc.com'
    }
    maven {
        url 'https://maven.cleanroommc.com'
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.3.72"
    }
}

dependencies {

    // Kotlin LIBs
    embed "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    embed "org.jetbrains.kotlinx:kotlinx-serialization-runtime:0.20.0"

    // Mixin Stuff
    annotationProcessor "org.spongepowered:mixin:0.7.11-SNAPSHOT"

    embed("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: "launchwrapper"
        exclude module: "guava"
        exclude module: "gson"
        exclude module: "commons-io"
    }

    // Spotify + Lyrics (Credits: GlideClient)
    embed("com.github.jikyo:romaji:0.0.4")
    embed('se.michaelthelin.spotify:spotify-web-api-java:6.5.4') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    embed 'com.neovisionaries:nv-i18n:1.29'
    compileOnly 'com.google.code.gson:gson:2.2.4'

    // Utility Libs
    embed "javax.annotation:javax.annotation-api:1.3.2"
    embed "com.github.ben-manes.caffeine:caffeine:2.9.3"
    embed "org.java-websocket:Java-WebSocket:1.6.0"
    embed "com.squareup.okhttp3:okhttp:3.14.9"
    embed "com.google.code.gson:gson:2.13.1"

    // Other Libs
    embed 'com.github.ClydoNetwork:MicrosoftAuthenticator:0cf2b9be2e'
    embed "org.joml:joml:1.10.5"

    embed files("libs/lwjgl-shindo.jar")
    embed files("libs/lwjgl-shindo-natives.jar")

    embed 'me.miki:shindo-client-api:1.1.2'
    embed 'me.miki:viashindo:1.0.0'

}

mixin {
    defaultObfuscationEnv = "notch"
    add sourceSets.main, "mixins.shindo.refmap.json"
}

sourceSets {
    main {
        kotlin { srcDirs = ['src/main/kotlin', 'src/main/java'] }
        java { srcDirs = ['src/main/java'] }
    }
}

processResources {
    inputs.files "src/main/resources"
    outputs.dir "build/classes/main"
    copy {
        from("src/main/resources")
        into("build/classes/main")
    }
}

task extractShindoNatives(type: Copy) {
    from(zipTree('libs/lwjgl-shindo-natives.jar'))
    into("$buildDir/natives")
}

runClient {
    dependsOn extractShindoNatives
    workingDir = file("run")
    jvmArgs += [
            "-Djava.library.path=$buildDir/natives",
            "-Djna.library.path=$buildDir/natives",
            "-Dorg.lwjgl.openal.libname=openal",
            "-Xmx4G"
    ]
}

// --- JAR buildado ---
jar {
    dependsOn configurations.embed
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes(
            "MixinConfigs": "mixins.shindo.json",
            "TweakClass": "me.miki.shindo.injection.mixin.ShindoTweaker",
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            "FMLAT": "shindo_at.cfg"
    )

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
        exclude 'META-INF/**'
        exclude 'META-INF/versions/**'
        exclude 'module-info.class'
    }
}